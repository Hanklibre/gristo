name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS runners cost 10x the Actions minutes of a private repo's monthly allowance
      # and aren't used here, so macOS only builds on manual runs (Actions > Run workflow).
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"name":"Windows","os":"windows-latest","artifact":"Gristo-Windows-x64","configure":""},{"name":"macOS","os":"macos-14","artifact":"Gristo-macOS-universal","configure":"-DCMAKE_OSX_ARCHITECTURES=\"arm64;x86_64\" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13"},{"name":"Linux","os":"ubuntu-24.04","artifact":"Gristo-Linux-x86_64","configure":"-G Ninja"}]' || '[{"name":"Windows","os":"windows-latest","artifact":"Gristo-Windows-x64","configure":""},{"name":"Linux","os":"ubuntu-24.04","artifact":"Gristo-Linux-x86_64","configure":"-G Ninja"}]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ART=build/plugin/Gristo_artefacts/Release
          codesign --force --deep --sign - "$ART/VST3/Gristo.vst3"
          codesign --force --deep --sign - "$ART/AU/Gristo.component"
          codesign --force --deep --sign - "$ART/Standalone/Gristo.app"

      - name: Validate with pluginval
        shell: bash
        run: |
          VST3="build/plugin/Gristo_artefacts/Release/VST3/Gristo.vst3"
          case "${{ runner.os }}" in
            Linux)
              curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
              unzip -q pv.zip
              xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
            macOS)
              curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
              unzip -q pv.zip
              ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
            Windows)
              curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
              unzip -q pv.zip
              ./pluginval.exe --strictness-level 10 --validate-in-process "$VST3" ;;
          esac

      - name: Package
        shell: bash
        run: |
          ART=build/plugin/Gristo_artefacts/Release
          mkdir -p dist
          cp -R "$ART/VST3/Gristo.vst3" dist/
          if [ -d "$ART/AU/Gristo.component" ]; then cp -R "$ART/AU/Gristo.component" dist/; fi
          if [ -d "$ART/Standalone/Gristo.app" ]; then cp -R "$ART/Standalone/Gristo.app" dist/; fi
          if [ -f "$ART/Standalone/Gristo.exe" ]; then cp "$ART/Standalone/Gristo.exe" dist/; fi
          if [ -f "$ART/Standalone/Gristo" ]; then cp "$ART/Standalone/Gristo" dist/; fi
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30

  android:
    # Android app (standalone). JUCE's CMake API doesn't target Android, so Projucer
    # generates an Android Studio project from android/Gristo.jucer, built with Gradle.
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Fetch JUCE 8.0.4 (with Projucer)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfreetype6 libfontconfig1
          curl -sSL -o "$RUNNER_TEMP/juce.zip" https://github.com/juce-framework/JUCE/releases/download/8.0.4/juce-8.0.4-linux.zip
          unzip -q "$RUNNER_TEMP/juce.zip" -d "$RUNNER_TEMP/juce"
          mv "$RUNNER_TEMP/juce/JUCE" android/JUCE

      - name: Generate the Android Studio project
        shell: bash
        run: xvfb-run -a android/JUCE/Projucer --resave android/Gristo.jucer

      - name: Build the APK
        shell: bash
        working-directory: android/Builds/Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease_Release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp android/Builds/Android/app/build/outputs/apk/release_/release/*.apk dist/Gristo.apk
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Gristo-Android-apk
          path: dist/
          retention-days: 30
